media:
  input: media
  output: /media
content:
  - name: posts
    label: Blog posts
    type: collection
    path: posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Web address
        description: "The post lives at octash.co/blog/<web address>. Leave empty to use the file name. Lowercase letters, numbers and hyphens only."
        type: string
      - name: description
        label: Summary
        description: "One or two sentences shown on the blog list and in Google and WhatsApp link previews. Leave empty to use the first paragraph."
        type: text
      - name: date
        label: Publish date
        type: date
      - name: cover
        label: Cover image
        description: "Wide image, about 1200 x 630."
        type: image
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft (hidden from the website)
        type: boolean
        default: false
      - name: body
        label: Post
        type: rich-text
